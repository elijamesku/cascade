[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.backends._legacy:_Backend"

[project]
name = "cascade"
version = "0.1.0"
description = "Frontier-quality coding at commodity cost via specialized model pipelines"
requires-python = ">=3.11"
dependencies = [
    "openai>=1.0",
    "httpx>=0.25",
    "pydantic>=2.0",
    "tiktoken>=0.5",
    "rich>=13.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "ruff>=0.4",
]

[tool.ruff]
line-length = 100
target-version = "py311"
